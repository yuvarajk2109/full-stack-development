<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control - Login</title>
</head>
<body>

  <!--
    TODO 1: Page header.
    Add a <header> containing an <h1> with the text "Mission Control".
  -->
  <header>
    <h1>Mission Control</h1>
  </header>


  <!--
    TODO 2: Login form, wrapped in <main>.
    Inside <main>, add:
      - a <form id="login-form">
      - an <h2>Log In</h2>
      - a username field: a <label for="username"> followed by an
        <input type="text" id="username" name="username">, with
        required and minlength="3" attributes
      - a password field: a <label for="password"> followed by an
        <input type="password" id="password" name="password">, with
        required and minlength="8" attributes
      - a submit button: <button type="submit">Log In</button>
    Every <label> must use for="..." matching its input's id - not
    just sit next to it in the markup.
  -->

  <main>
    <form id="login-form">
      <h2>Log In</h2>
      <label for="username">Username: </label>
      <input type="text" id="username" name="username" minlength="3" required>
      <br>
      <label for="password">Password: </label>
      <input type="password" id="password" name="password" minlength="8" required>
      <br>
      <button type="submit">Log In</button>
    </form>
  </main>


  <!--
    TODO 3: Page footer.
    Add a <footer> containing a <p> with the text
    "LEAP Mission Control".
  -->
    <footer>
      <p>LEAP Mission Control</p>
    </footer>

</body>
</html>
