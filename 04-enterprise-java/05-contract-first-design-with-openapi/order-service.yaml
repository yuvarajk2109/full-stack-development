openapi: 3.0.3
info:
  title: Order Processing & Settlement Service
  description: >
    Retrieves the status of a previously submitted order.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /v1

paths:
  /orders/{id}:
    get:
      summary: Fetch order status for the given Order ID
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        # TODO: add a path parameter definition for `id` - name, in, required,
        # and a schema (type: string is fine)
        - name: id
          in: path
          required: true
          description: The order ID whose order status we need to check
          schema:
            type: string

      responses:
        '200':
          description: order status has been fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                id: 3
                status: ACCEPTED
                fee: 0.01

        # TODO: add a 404 response for an id that doesn't exist
        '404':
            description: order ID not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
        # and a 401
        # response for a missing/invalid JWT. Both should reference
        # ErrorResponse (already defined below).
        '401':
          description: missing/invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    OrderResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
        fee:
          type: number
          format: double
          nullable: true
          description: Present only when status is ACCEPTED
        reason:
          type: string
          nullable: true
          description: Present only when status is REJECTED

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
