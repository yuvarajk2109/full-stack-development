info:
  name: Create Order
  type: http
  seq: 3

http:
  method: POST
  url: accounts/1/orders
  body:
    type: json
    data: |-
      {
        "ticker": "ULVR.L",
        "instrumentType": "EQUITY",
        "quantity": 10,
        "price": 40.0,
        "side": "BUY"
      }
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
