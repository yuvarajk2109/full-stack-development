info:
  name: Create Order
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/orders
  body:
    type: json
    data: |-
      {
        "instrumentType": "EQUITY",
        "quantity": 1000005,
        "price": 150000.00,
        "side": "BUY"
      }
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
